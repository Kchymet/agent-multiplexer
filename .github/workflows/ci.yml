# PR-gating CI for amux. Until AGE-130 there was none — a wire-protocol change in
# harnessproto could merge green here and only surface downstream (the harness
# mirror) up to 24h later. This runs the root module and the nested harnessproto
# module (the published wire protocol), so a JSON-tag/field change that breaks the
# golden fixtures in harnessproto/golden_test.go fails this workflow on the PR.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      # Short canonical paths fit Darwin Unix sockets and no-follow traversal.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: canonical macOS temporary directory
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: vet
        run: make vet
      - name: test
        run: make test

  namespace-runtime:
    # Keep this on 22.04: its ordinary runner user can create user/PID
    # namespaces without the host-specific AppArmor exception newer Ubuntu
    # releases require for private executable paths.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: checkout pinned bubblewrap source
        uses: actions/checkout@v4
        with:
          repository: containers/bubblewrap
          # Upstream v0.12.0. This is the first release with safe mount-target
          # creation via openat2(RESOLVE_IN_ROOT).
          ref: 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          path: .ci/bubblewrap-v0.12.0
      - name: install ephemeral bubblewrap build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-dev socat
      - name: build private bubblewrap runner
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/bwrap-tools"
          "$RUNNER_TEMP/bwrap-tools/bin/pip" install 'meson==1.9.0' 'ninja==1.13.0'
          export PATH="$RUNNER_TEMP/bwrap-tools/bin:$PATH"
          meson setup "$RUNNER_TEMP/bwrap-build" .ci/bubblewrap-v0.12.0 \
            -Dtests=false -Dman=disabled -Dselinux=disabled \
            -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bwrap-build"
          test "$("$RUNNER_TEMP/bwrap-build/bwrap" --version)" = 'bubblewrap 0.12.0'
          echo "$RUNNER_TEMP/bwrap-build" >> "$GITHUB_PATH"
      - name: test real namespace boundary
        env:
          AMUX_REQUIRE_NAMESPACE_TEST: "1"
        run: |
          go test ./internal/panespec \
            -run 'Test(RuntimeNamespaceRejectsAliasesFDsAndFutureSiblings|RuntimeGeneratedClaudeHookUsesExactInstalledAlias|RuntimeGitObjectGrantIsExactReadOnly|ScopeRejectsSiblingSessionSocket)$' \
            -count=1 -timeout=60s -v
          go test ./internal/daemon \
            -run '^TestAgentNamespaceCommandSurface$' \
            -count=1 -timeout=120s -v
      - name: download pinned native harness fixtures
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agent-runtimes/codex" "$RUNNER_TEMP/agent-runtimes/claude"
          cd "$RUNNER_TEMP/agent-runtimes"
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.153.4/codex-package-x86_64-unknown-linux-musl.tar.gz \
            -o codex.tar.gz
          curl --fail --location --retry 3 \
            https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-2.1.263.tgz \
            -o claude.tgz
          echo 'a822187e1a2420c61c5926721bfbd878701ed95547c9bb0d4de4498a16ba1821  codex.tar.gz' | sha256sum -c -
          echo '8b6207348ad56fdcde085a0ad1f7cff0dfe06ce2c6c1bf97f69f1a1a7b6d0945  claude.tgz' | sha256sum -c -
          tar -xzf codex.tar.gz -C codex
          tar -xzf claude.tgz -C claude
      - name: test real nested harness command surfaces
        shell: bash
        env:
          AMUX_REQUIRE_NAMESPACE_TEST: "1"
          TERM: xterm-256color
        run: |
          export AMUX_TEST_CODEX_PACKAGE="$RUNNER_TEMP/agent-runtimes/codex"
          export AMUX_TEST_CLAUDE_BIN="$RUNNER_TEMP/agent-runtimes/claude/package/claude"
          for runtime in claude codex codex-app-server; do
            AMUX_TEST_AGENT_RUNTIME="$runtime" go test ./internal/daemon \
              -run '^TestAgentRuntimeCommandSurface$' -count=1 -timeout=120s -v
          done

  seatbelt-runtime:
    runs-on: macos-14
    env:
      TMPDIR: /private/tmp
      AMUX_REQUIRE_NAMESPACE_TEST: "1"
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test real Seatbelt boundary
        run: |
          go test ./internal/panespec \
            -run 'Test(SeatbeltRuntime.*|RuntimeGitObjectGrantIsExactReadOnly|ScopeRejectsSiblingSessionSocket)$' \
            -count=1 -timeout=120s -v
          go test ./internal/daemon \
            -run '^Test(Agent(Seatbelt|Namespace)CommandSurface|CredentialBrokerSeatbeltRoundTrip|GitHubBrokerSeatbeltRoundTrip)$' \
            -count=1 -timeout=120s -v
      - name: download pinned native harness fixtures
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/agent-runtimes/codex" "$RUNNER_TEMP/agent-runtimes/claude"
          cd "$RUNNER_TEMP/agent-runtimes"
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.155.1/codex-package-aarch64-apple-darwin.tar.gz \
            -o codex.tar.gz
          curl --fail --location --retry 3 \
            https://registry.npmjs.org/@anthropic-ai/claude-code-darwin-arm64/-/claude-code-darwin-arm64-2.1.278.tgz \
            -o claude.tgz
          echo 'e6e08717da9e35b72332eff753527fe79a9ae876081033c5c6820a8e5f58b943  codex.tar.gz' | shasum -a 256 -c -
          echo '934a258c59e90ed6ba768d0d46502d3163607dec949845650af80e5f1228330c  claude.tgz' | shasum -a 256 -c -
          tar -xzf codex.tar.gz -C codex
          tar -xzf claude.tgz -C claude
      - name: test real harness command surfaces
        run: |
          export AMUX_TEST_CODEX_PACKAGE="$RUNNER_TEMP/agent-runtimes/codex"
          export AMUX_TEST_CLAUDE_BIN="$RUNNER_TEMP/agent-runtimes/claude/package/claude"
          for runtime in claude codex codex-app-server; do
            AMUX_TEST_AGENT_RUNTIME="$runtime" go test ./internal/daemon \
              -run '^TestAgentRuntimeCommandSurface$' -count=1 -timeout=120s -v
          done
      - name: test native goal and Claude continuation after restart
        run: |
          export PATH="$RUNNER_TEMP/agent-runtimes/codex/bin:$RUNNER_TEMP/agent-runtimes/claude/package:$PATH"
          AMUX_CODEX_APP_SERVER_SMOKE=1 go test ./internal/codexapp \
            -run '^TestSmokeGoal(Restart|Automatic)$' -count=1 -timeout=300s -v
          AMUX_CLAUDE_RESUME_SMOKE=1 go test ./internal/agent \
            -run '^TestSmokeClaudeResumeWork$' -count=1 -timeout=70s -v
      - name: cross compile supported targets
        run: make cross
