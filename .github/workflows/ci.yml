# PR-gating CI for amux. Until AGE-130 there was none — a wire-protocol change in
# harnessproto could merge green here and only surface downstream (the harness
# mirror) up to 24h later. This runs the root module and the nested harnessproto
# module (the published wire protocol), so a JSON-tag/field change that breaks the
# golden fixtures in harnessproto/golden_test.go fails this workflow on the PR.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      # Short canonical paths fit Darwin Unix sockets and no-follow traversal.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: canonical macOS temporary directory
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: bundled notices are current
        run: make notices-check
      - name: vet
        run: make vet
      - name: test
        run: make test
      - name: reachable dependency vulnerabilities
        run: make vuln

  namespace-runtime:
    # Keep this on 22.04: its ordinary runner user can create user/PID
    # namespaces without the host-specific AppArmor exception newer Ubuntu
    # releases require for private executable paths.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: checkout pinned bubblewrap source
        uses: actions/checkout@v4
        with:
          repository: containers/bubblewrap
          # Upstream v0.12.0. This is the first release with safe mount-target
          # creation via openat2(RESOLVE_IN_ROOT).
          ref: 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          path: .ci/bubblewrap-v0.12.0
      - name: install ephemeral bubblewrap build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcap-dev socat
      - name: build private bubblewrap runner
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/bwrap-tools"
          "$RUNNER_TEMP/bwrap-tools/bin/pip" install 'meson==1.9.0' 'ninja==1.13.0'
          export PATH="$RUNNER_TEMP/bwrap-tools/bin:$PATH"
          meson setup "$RUNNER_TEMP/bwrap-build" .ci/bubblewrap-v0.12.0 \
            -Dtests=false -Dman=disabled -Dselinux=disabled \
            -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bwrap-build"
          test "$("$RUNNER_TEMP/bwrap-build/bwrap" --version)" = 'bubblewrap 0.12.0'
          echo "$RUNNER_TEMP/bwrap-build" >> "$GITHUB_PATH"
      - name: test real namespace boundary
        env:
          AMUX_REQUIRE_NAMESPACE_TEST: "1"
        run: |
          go test ./internal/panespec \
            -run 'Test(RuntimeNamespaceRejectsAliasesFDsAndFutureSiblings|RuntimeGeneratedClaudeHookUsesExactInstalledAlias|RuntimeGitObjectGrantIsExactReadOnly|ScopeRejectsSiblingSessionSocket|ScopeMapsOnlyOwnCodexPhysicalSocket)$' \
            -count=1 -timeout=60s -v
          go test ./internal/daemon \
            -run '^Test(AgentNamespaceCommandSurface|CentralClaudeLaunchDeliversTokenInsideProtectedNamespace)$' \
            -count=1 -timeout=120s -v
      - name: download pinned native harness fixtures
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agent-runtimes/codex" "$RUNNER_TEMP/agent-runtimes/codex-current" "$RUNNER_TEMP/agent-runtimes/claude" "$RUNNER_TEMP/codex-0.157.1"
          cd "$RUNNER_TEMP/agent-runtimes"
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.153.4/codex-package-x86_64-unknown-linux-musl.tar.gz \
            -o codex.tar.gz
          curl --fail --location --retry 3 \
            https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-2.1.263.tgz \
            -o claude.tgz
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.157.1/codex-x86_64-unknown-linux-musl.tar.gz \
            -o codex-0.157.1.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.157.1/codex-package-x86_64-unknown-linux-musl.tar.gz \
            -o codex-current.tar.gz
          echo 'a822187e1a2420c61c5926721bfbd878701ed95547c9bb0d4de4498a16ba1821  codex.tar.gz' | sha256sum -c -
          echo '8b6207348ad56fdcde085a0ad1f7cff0dfe06ce2c6c1bf97f69f1a1a7b6d0945  claude.tgz' | sha256sum -c -
          echo 'e98c1e8e028e8137fa2d2415c82ec58e7b3701a627e3554aace5b3ca31454af2  codex-0.157.1.tar.gz' | sha256sum -c -
          echo '0e211868c9fd73cb49ad35ac675b5eafdf6b9f453df8a493df980c59a590fe5f  codex-current.tar.gz' | sha256sum -c -
          tar -xzf codex.tar.gz -C codex
          tar -xzf claude.tgz -C claude
          tar -xzf codex-0.157.1.tar.gz -C "$RUNNER_TEMP/codex-0.157.1"
          tar -xzf codex-current.tar.gz -C codex-current
          test "$(codex-current/bin/codex --version)" = 'codex-cli 0.157.1'
      - name: test real embedded Codex history routing
        env:
          AMUX_TEST_CODEX_BIN: ${{ runner.temp }}/codex-0.157.1/codex-x86_64-unknown-linux-musl
          AMUX_REQUIRE_CODEX_SCROLL: "1"
          AMUX_CODEX_SCROLL_EVIDENCE: ${{ runner.temp }}/codex-scroll-evidence
        run: go test ./internal/nativetui -run '^TestCodexEmbeddedScroll$' -count=1 -timeout=180s -v
      - name: upload embedded Codex scroll evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-scroll-evidence
          path: ${{ runner.temp }}/codex-scroll-evidence
          if-no-files-found: error
      - name: test native central API-key login and delivery (synthetic key only)
        env:
          AMUX_TEST_CODEX_BIN: ${{ runner.temp }}/codex-0.157.1/codex-x86_64-unknown-linux-musl
        run: |
          go test ./internal/codexapp ./internal/daemon \
            -run '^TestSmoke(APIKeyNativeOwnerAndMemoryDelivery|CentralAPIKeyBindingNative)$' \
            -count=1 -timeout=90s -v
      - name: test real nested harness command surfaces
        shell: bash
        env:
          AMUX_REQUIRE_NAMESPACE_TEST: "1"
          TERM: xterm-256color
        run: |
          export AMUX_TEST_CODEX_PACKAGE="$RUNNER_TEMP/agent-runtimes/codex"
          export AMUX_TEST_CLAUDE_BIN="$RUNNER_TEMP/agent-runtimes/claude/package/claude"
          for runtime in claude codex codex-app-server; do
            AMUX_TEST_AGENT_RUNTIME="$runtime" go test ./internal/daemon \
              -run '^TestAgentRuntimeCommandSurface$' -count=1 -timeout=120s -v
          done
          export AMUX_TEST_CODEX_PACKAGE="$RUNNER_TEMP/agent-runtimes/codex-current"
          for runtime in codex codex-app-server; do
            AMUX_TEST_AGENT_RUNTIME="$runtime" go test ./internal/daemon \
              -run '^TestAgentRuntimeCommandSurface$' -count=1 -timeout=180s -v
          done
      - name: test old and relocated Codex App Server sockets
        shell: bash
        env:
          AMUX_REQUIRE_NAMESPACE_TEST: "1"
        run: |
          old_home="$RUNNER_TEMP/codex-0.153.4-home"
          mkdir -p "$old_home/bin"
          cp "$RUNNER_TEMP/agent-runtimes/codex/bin/codex" "$old_home/bin/codex"
          HOME="$old_home" PATH="$old_home/bin:$PATH" \
            AMUX_CODEX_APP_SERVER_SMOKE=1 go test ./internal/daemon \
              -run '^TestSandboxedAppServerLaunch$' -count=1 -timeout=120s -v
          AMUX_TEST_CODEX_01571_BIN="$RUNNER_TEMP/codex-0.157.1/codex-x86_64-unknown-linux-musl" \
            AMUX_TEST_CODEX_01571_ARCHIVE="$RUNNER_TEMP/agent-runtimes/codex-0.157.1.tar.gz" \
            go test ./internal/codexapp \
              -run '^TestCompatCodex01571ProtectedAttachReconnect$' -count=1 -timeout=180s -v

  seatbelt-runtime:
    runs-on: macos-14
    env:
      TMPDIR: /private/tmp
      AMUX_REQUIRE_NAMESPACE_TEST: "1"
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test real Seatbelt boundary
        run: |
          go test ./internal/panespec \
            -run 'Test(SeatbeltRuntime.*|RuntimeGitObjectGrantIsExactReadOnly|ScopeRejectsSiblingSessionSocket)$' \
            -count=1 -timeout=120s -v
          go test ./internal/daemon \
            -run '^Test(Agent(Seatbelt|Namespace)CommandSurface|CentralClaudeLaunchDeliversTokenInsideProtectedNamespace|CredentialBrokerSeatbeltRoundTrip|GitHubBrokerSeatbeltRoundTrip)$' \
            -count=1 -timeout=120s -v
      - name: download pinned native harness fixtures
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/agent-runtimes/codex" "$RUNNER_TEMP/agent-runtimes/claude"
          cd "$RUNNER_TEMP/agent-runtimes"
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.155.1/codex-package-aarch64-apple-darwin.tar.gz \
            -o codex.tar.gz
          curl --fail --location --retry 3 \
            https://registry.npmjs.org/@anthropic-ai/claude-code-darwin-arm64/-/claude-code-darwin-arm64-2.1.278.tgz \
            -o claude.tgz
          echo 'e6e08717da9e35b72332eff753527fe79a9ae876081033c5c6820a8e5f58b943  codex.tar.gz' | shasum -a 256 -c -
          echo '934a258c59e90ed6ba768d0d46502d3163607dec949845650af80e5f1228330c  claude.tgz' | shasum -a 256 -c -
          tar -xzf codex.tar.gz -C codex
          tar -xzf claude.tgz -C claude
      - name: test real harness command surfaces
        run: |
          export AMUX_TEST_CODEX_PACKAGE="$RUNNER_TEMP/agent-runtimes/codex"
          export AMUX_TEST_CLAUDE_BIN="$RUNNER_TEMP/agent-runtimes/claude/package/claude"
          for runtime in claude codex codex-app-server; do
            AMUX_TEST_AGENT_RUNTIME="$runtime" go test ./internal/daemon \
              -run '^TestAgentRuntimeCommandSurface$' -count=1 -timeout=120s -v
          done
      - name: test native goal and Claude continuation after restart
        run: |
          export PATH="$RUNNER_TEMP/agent-runtimes/codex/bin:$RUNNER_TEMP/agent-runtimes/claude/package:$PATH"
          AMUX_CODEX_APP_SERVER_SMOKE=1 go test ./internal/codexapp \
            -run '^TestSmokeGoal(Restart|Automatic)$' -count=1 -timeout=300s -v
          AMUX_CLAUDE_RESUME_SMOKE=1 go test ./internal/agent \
            -run '^TestSmokeClaudeResumeWork$' -count=1 -timeout=70s -v
      - name: test Codex 0.157 socket relocation under Seatbelt
        run: |
          mkdir -p "$RUNNER_TEMP/codex-0.157.1"
          cd "$RUNNER_TEMP/codex-0.157.1"
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.157.1/codex-package-aarch64-apple-darwin.tar.gz \
            -o codex.tar.gz
          echo '6cda538d19c2f4d9dce965369aa22011afa9dce8c7a73c234b66eb3611ea4aab  codex.tar.gz' | shasum -a 256 -c -
          tar -xzf codex.tar.gz
          cd "$GITHUB_WORKSPACE"
          AMUX_TEST_CODEX_BIN="$RUNNER_TEMP/codex-0.157.1/bin/codex" go test ./internal/panespec \
            -run '^TestSeatbeltCodex' -count=1 -timeout=60s -v
      - name: cross compile supported targets
        run: make cross

  # TEMPORARY (PR 206 diagnostics, remove before merge): repeat the macOS-only
  # failures on the merged tree to measure their rate with diagnostics on.
  macos-pressure-repeat:
    runs-on: macos-14
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: releasing-client pressure x15
        run: |
          set -o pipefail
          go test ./internal/daemon \
            -run '^TestCentralClaudeLaunchDeliversTokenInsideProtectedNamespace$/^fresh-launch-under-releasing-client-pressure$' \
            -count=15 -timeout=40m -v 2>&1 | tee pressure.log | grep -E 'releasing fetches|--- (PASS|FAIL)|^(ok|FAIL)|_test.go'
      - name: blocked-release ordering x1000
        if: always()
        run: go test ./internal/sessionrpc -run '^TestReleaseProcessedBehindCapacityBlockedRequest$' -count=1000 -timeout=20m
      - name: held-descriptor visibility probe x20
        if: always()
        run: set -o pipefail; go test ./internal/sessionrpc -run '^TestHeldDirectoryListingSeesEveryPublishAndClaim$' -count=20 -timeout=20m -v 2>&1 | grep -E -- '--- (PASS|FAIL)|_test.go|^(ok|FAIL)'
